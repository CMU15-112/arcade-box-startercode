# uv settings for the es user: 112.sh, arcade-admin and anything run by hand.
# Games run on the system Python 3.10 unless an admin sets another version for a
# game (`arcade-admin python GAME 3.14`). uv never downloads a Python by itself;
# other versions come only from `uv python install` (arcade-admin and
# setup-box.sh do that).
python-downloads = "manual"
python-preference = "system"
